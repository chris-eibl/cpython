name: Windows ARM64 CI experiment

on:
  workflow_dispatch:
  push:
    branches:
      - '3.14.before'
  pull_request:
    branches:
      - '3.14.before'

permissions:
  contents: read

jobs:
  probe:
    name: Probe VS2026 ARM64 v143
    runs-on: windows-11-vs2026-arm

    steps:
      - name: Inspect Visual Studio and all MSVC toolsets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          Write-Host "=== Architecture ==="
          Write-Host "OSArchitecture: $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          Write-Host "PROCESSOR_ARCHITECTURE: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "RUNNER_ARCH: $env:RUNNER_ARCH"

          Write-Host ""
          Write-Host "=== Visual Studio installations ==="

          $vs = & $vswhere `
            -latest `
            -products * `
            -property installationPath

          Write-Host "VS installation: $vs"

          $msbuild = Join-Path $vs "MSBuild\Current\Bin\MSBuild.exe"

          Write-Host "MSBuild: $msbuild"

          if (-not (Test-Path $msbuild)) {
            throw "MSBuild not found: $msbuild"
          }

          & $msbuild -version

          Write-Host ""
          Write-Host "=== ALL MSVC toolsets ==="

          $toolsets = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory |
            Sort-Object Name

          $results = foreach ($toolset in $toolsets) {
            $root = $toolset.FullName

            [PSCustomObject]@{
              Toolset         = $toolset.Name
              HostX86_X86     = Test-Path "$root\bin\HostX86\x86\cl.exe"
              HostX86_ARM64   = Test-Path "$root\bin\HostX86\arm64\cl.exe"
              HostARM64_X86   = Test-Path "$root\bin\Hostarm64\x86\cl.exe"
              HostARM64_ARM64 = Test-Path "$root\bin\Hostarm64\arm64\cl.exe"
            }
          }

          $results | Format-Table -AutoSize

          Write-Host ""
          Write-Host "=== Compiler paths ==="

          foreach ($toolset in $toolsets) {
            Write-Host "--- $($toolset.Name) ---"

            Get-ChildItem "$($toolset.FullName)\bin" -Recurse -Filter cl.exe -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
          }

          Write-Host ""
          Write-Host "=== VS component discovery: v143 ==="

          & $vswhere `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.v143 `
            -format json

          Write-Host ""
          Write-Host "=== VS component discovery: v143 + ARM64 ==="

          & $vswhere `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.v143 `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -format json

      - name: Inspect CPython MSBuild properties
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vs = & $vswhere `
            -latest `
            -products * `
            -property installationPath

          $msbuild = Join-Path $vs "MSBuild\Current\Bin\MSBuild.exe"

          Write-Host "=== MSBuild properties for CPython _freeze_module ==="

          & $msbuild `
            "$env:GITHUB_WORKSPACE\PCbuild\_freeze_module.vcxproj" `
            /p:Configuration=Debug `
            /p:Platform=ARM64 `
            /p:PreferredToolArchitecture=x86 `
            /getProperty:VisualStudioVersion `
            /getProperty:MSBuildToolsVersion `
            /getProperty:VCTargetsPath `
            /getProperty:Platform `
            /getProperty:PlatformToolset `
            /getProperty:BasePlatformToolset `
            /getProperty:PreferredToolArchitecture `
            /getProperty:VCToolsVersion `
            /getProperty:VCToolsInstallDir `
            /getProperty:VCInstallDir `
            /getProperty:VSInstallDir
